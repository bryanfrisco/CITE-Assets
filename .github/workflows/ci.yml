# Install, lint, typecheck, and the tests that need nothing but Node.
#
# WHAT THIS DOES NOT RUN
# ----------------------
# Eleven of the fourteen suites talk to a real Supabase stack. They are the
# valuable ones — they are what proves RLS actually refuses things — and they
# are deliberately NOT run here on every push, because bringing the stack up
# takes minutes and the suites write rows that cannot be deleted afterwards.
#
# `db` below does run them, on a scheduled build and on demand, against a
# throwaway stack that is destroyed with the runner. tests/_guard.mjs refuses
# to run against anything that is not localhost, so a misconfigured secret
# cannot point them at production.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 21:00 UTC daily — after the working day in WIB, before the overnight
    # notification job at 22:00, so a broken migration is known before it runs.
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, and the offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile is the whole point of moving off npm: the build fails
      # if the lockfile and package.json disagree, rather than quietly
      # resolving something different from what was tested.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run typecheck

      # Pure Node, no database: the Code 128 tables and the checksum.
      - run: pnpm run test:barcode

  db:
    name: Database suites
    runs-on: ubuntu-latest
    # Only on a schedule or by hand. See the note at the top.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # The anon key is generated by the local stack from the well-known
      # development JWT secret, so it is the same on every runner and is not a
      # secret at all. Reading it from `supabase status` rather than hard-coding
      # it means a CLI change cannot silently break the suites.
      - name: Export the local keys
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(supabase status --output json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"

      - run: pnpm test

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
